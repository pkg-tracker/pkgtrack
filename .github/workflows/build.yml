# Builds and tests every push and pull request.
# On a push to main:
#  - if Cargo.lock's packages changed since the last release (a dependency
#    update or a vulnerability fix) and the version wasn't raised by hand, it
#    raises the micro version (0.1.5 -> 0.1.6) and commits that to main
#    (scripts/deps-version.sh);
#  - if the version in Cargo.toml has no release yet, it tags v<version> and
#    publishes a GitHub release with the .deb, the .rpm, the AppImage and a
#    plain binary tarball, with the changed dependencies at the top of the
#    notes. Running apps then show the "new version available" popup.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  bump:
    # Every dependency change must reach users as a new version.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Raise the micro version if dependencies changed
        id: bump
        run: |
          old=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          next=$(scripts/deps-version.sh bump)
          if [ -n "$next" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -am "Release $next: dependency updates" \
              -m "Dependencies changed since v$old:" \
              -m "$(scripts/deps-version.sh changes "v$old")"
            # A push with the workflow's own token starts no new run; this run
            # goes on to build and release the new commit.
            git push origin HEAD:main
            echo "Raised the version from $old to $next"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    # bump is skipped on pull requests and other branches.
    if: ${{ !cancelled() && needs.bump.result != 'failure' }}
    # The oldest supported runner gives the widest glibc compatibility.
    runs-on: ubuntu-22.04
    env:
      # The commit shown in the About window (the bump's, when there is one).
      PKGTRACK_SOURCE_SHA: ${{ needs.bump.outputs.sha }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha || github.sha }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version $v"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --locked

      - name: Build .deb
        run: ./packaging/build-deb.sh

      - name: Build .rpm
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm appstream
          ./packaging/build-rpm.sh

      - name: Build AppImage
        env:
          # Runners have no FUSE; let appimagetool unpack itself instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./packaging/build-appimage.sh

      - name: Binary tarball
        run: |
          v=${{ steps.version.outputs.version }}
          d=pkgtrack-$v-x86_64-linux
          mkdir -p "$d"
          cp target/release/pkgtrack install.sh README.md LICENSE "$d"/
          mkdir -p "$d/target/release" && mv "$d/pkgtrack" "$d/target/release/"
          cp -r assets "$d"/
          tar czf "dist/$d.tar.gz" "$d"
          cd dist && sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v5
        with:
          name: pkgtrack-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [bump, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.released == 'false' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SHA: ${{ needs.bump.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: List changed dependencies
        run: |
          : > notes.md
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$SHA^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            list=$(scripts/deps-version.sh changes "$prev")
            if [ -n "$list" ]; then
              printf '### Updated dependencies (since %s)\n\n%s\n' "$prev" "$list" > notes.md
            fi
          fi
          cat notes.md

      - uses: actions/download-artifact@v5
        with:
          name: pkgtrack-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release v${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Package Tracker ${{ needs.build.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes
